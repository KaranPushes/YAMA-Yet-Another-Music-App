spring:
  application:
    name: yama-music-server-test
  datasource:
    url: jdbc:h2:mem:yamatest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

yama:
  music:
    library-path: target/test-music
    artwork-path: target/test-artwork
    supported-extensions:
      - mp3
      - flac
      - m4a
      - aac
      - ogg
      - wav
  downloader:
    url: http://localhost:5000

